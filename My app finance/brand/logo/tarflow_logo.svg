<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e5fd4"/>
      <stop offset="100%" stop-color="#0a3a96"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e5fd4"/>
      <stop offset="60%" stop-color="#3aa3ff"/>
      <stop offset="100%" stop-color="#5ec8ff"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo geral (transparente para usar em qualquer cor) -->
  <rect width="1200" height="1200" fill="#0a1e3a"/>

  <!-- Ícone arredondado -->
  <g transform="translate(350, 200)">
    <rect x="0" y="0" width="500" height="500" rx="100" ry="100" fill="url(#bg)"/>

    <!-- Letra T -->
    <g filter="url(#shadow)">
      <path d="M 140 120 L 360 120 L 360 195 L 285 195 L 285 400 L 215 400 L 215 195 L 140 195 Z"
            fill="url(#letter)"/>
    </g>

    <!-- Seta ascendente -->
    <g>
      <path d="M 130 360 C 215 315 280 335 345 295 L 360 285 L 410 275 L 380 320 L 360 320 C 290 360 225 350 155 380 Z"
            fill="url(#arrow)"
            opacity="0.95"/>
      <path d="M 360 225 L 420 265 L 360 305 L 372 280 L 360 250 Z"
            fill="#5ec8ff"
            opacity="0.95"/>
    </g>
  </g>

  <!-- Texto Tarflow -->
  <text x="600" y="840" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="140" font-weight="800" fill="#ffffff" letter-spacing="-3">Tarflow</text>

  <!-- Tagline -->
  <text x="600" y="920" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="42" font-weight="400" fill="#7ba6d9">
    Controle suas finanças com <tspan fill="#5ec8ff">clareza</tspan>.
  </text>
</svg>
