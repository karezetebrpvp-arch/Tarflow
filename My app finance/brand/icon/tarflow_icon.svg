<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e5fd4"/>
      <stop offset="100%" stop-color="#0a3a96"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e5fd4"/>
      <stop offset="60%" stop-color="#3aa3ff"/>
      <stop offset="100%" stop-color="#5ec8ff"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo arredondado -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Letra T estilizada -->
  <g filter="url(#shadow)">
    <path d="M 150 130 L 362 130 L 362 200 L 290 200 L 290 400 L 222 400 L 222 200 L 150 200 Z"
          fill="url(#letter)"/>
  </g>

  <!-- Seta ascendente -->
  <g>
    <path d="M 140 360 C 220 320 280 340 350 300 L 360 290 L 410 280 L 380 320 L 360 320 C 290 360 230 350 160 380 Z"
          fill="url(#arrow)"
          opacity="0.95"/>
    <!-- Ponta da seta -->
    <path d="M 360 230 L 420 270 L 360 310 L 372 280 L 360 250 Z"
          fill="#5ec8ff"
          opacity="0.95"/>
  </g>
</svg>
